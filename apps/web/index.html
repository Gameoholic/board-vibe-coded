<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- interactive-widget: a phone's keyboard shrinks the page instead of covering its lower half, so a form
         open over the board (placed against the window each frame) moves up clear of the keys. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Board</title>
    <script>
      // Sets the theme before first paint, so a dark device never flashes light while the app loads.
      // Mirrors useTheme.ts (its "board-theme" key and how a choice resolves): keep the two in step.
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem("board-theme") || "null") || {};
          var choice = pref.choice || "system";
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = choice === "system" ? (systemDark ? pref.dark || "dark" : "light") : choice;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
